          rm -f .github/workflows/bootstrap-meta-agent-shadow-migration.yml

          test "$(find /tmp/meta-agent-payload -type f | wc -l | tr -d ' ')" = "$EXPECTED_FILE_COUNT"
          test ! -e memory
          test ! -e migration/initial-memory-system-alignment-v0.1.md
          test ! -e migration/initial-memory-system-alignment-v0.1.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            README.md MIGRATION-STATUS.md \
            current authority methodology cases history handoff research candidates decision-support migration \
            .github/workflows/bootstrap-meta-agent-shadow-migration.yml

          git commit -m "Import frozen Meta-Agent source snapshot as non-authoritative shadow"
          git push origin "$SHADOW_BRANCH"

      - name: Open one draft pull request when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
