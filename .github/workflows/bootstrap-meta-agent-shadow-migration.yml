name: Bootstrap Meta-Agent shadow migration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/bootstrap-meta-agent-shadow-migration.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  import-source-snapshot:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: 08822407d/Mnemosyne
      SOURCE_COMMIT: 8ef1c43b18b8686a30ffef544ca8b32fce1ca6cb
      SOURCE_ROOT: target-projects/meta-agent
      EXPECTED_FILE_COUNT: "226"
      SHADOW_BRANCH: meta-agent-shadow-migration-001

    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight destination lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          if git ls-remote --exit-code --heads origin "$SHADOW_BRANCH" >/dev/null 2>&1; then
            echo "Shadow branch already exists; refusing a duplicate run."
            exit 1
          fi
          test -z "$(gh pr list --state open --head "$SHADOW_BRANCH" --json number --jq '.[].number')"

      - name: Fetch the frozen Meta-Agent source snapshot
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://github.com/${SOURCE_REPOSITORY}.git" /tmp/mnemosyne
          git -C /tmp/mnemosyne checkout --detach "$SOURCE_COMMIT"
          mkdir -p /tmp/meta-agent-payload
          cp -a "/tmp/mnemosyne/${SOURCE_ROOT}/." /tmp/meta-agent-payload/

          source_count="$(find /tmp/meta-agent-payload -type f | wc -l | tr -d ' ')"
          test "$source_count" = "$EXPECTED_FILE_COUNT"

          tree_count="$(git -C /tmp/mnemosyne ls-tree -r --name-only "$SOURCE_COMMIT" -- "${SOURCE_ROOT}/" | wc -l | tr -d ' ')"
          test "$tree_count" = "$EXPECTED_FILE_COUNT"

      - name: Build the non-authoritative shadow branch
        run: |
          set -euo pipefail
          git checkout -b "$SHADOW_BRANCH"
          cp -a /tmp/meta-agent-payload/. ./

          mkdir -p current handoff migration

          cat > current/active-context.md <<'EOF'
---
target_project_id: meta-agent
artifact_id: META-AGENT-V0.1-ACTIVE-CONTEXT-001
artifact_role: non_execution_current_state
status: dedicated_repository_shadow_import_ready_for_review
authority_level: operational_support
target_runtime_truth_source: false
last_updated_by_task: META-AGENT-DEDICATED-REPOSITORY-SHADOW-MIGRATION-001
design_version: 0.1.0
---

# Meta-Agent Active Context — Dedicated Repository Shadow Import

```yaml
route: META_AGENT_PRODUCT_BUILD
phase: dedicated_repository_shadow_import_review
owner_disposition: ACCEPT_WITH_LIMITATIONS

source_authority:
  repository: 08822407d/Mnemosyne
  commit: 8ef1c43b18b8686a30ffef544ca8b32fce1ca6cb
  target_truth_path: target-projects/meta-agent/current/approved-spec.md
  remains_authoritative_until_explicit_cutover: true

destination_shadow:
  repository: 08822407d/Meta-Agent
  branch: meta-agent-shadow-migration-001
  target_truth_path_candidate: current/approved-spec.md
  authoritative: false
  active_writer: false
  operational_activation: false

migration_payload:
  source_root: target-projects/meta-agent/
  base_files_imported: 226
  path_mapping: project_root_flattening
  live_navigation_transformed:
    - current/active-context.md
    - handoff/handoff-current.md

initial_memory_system_foundation:
  status: explicitly_deferred_until_after_migration_and_destination_only_recovery
  adopted_by_this_import: false

pilot_authorized: false
private_material_authorized: false
RAG_authorized: false
MCP_authorized: false
automation_authorized: false
```

## Completed in this phase

- The frozen 226-file Meta-Agent source snapshot has been copied into the dedicated repository on a non-authoritative shadow branch.
- Existing target truth, authority, methodology, case ledger, history, research, candidates, decision support and historical handoff evidence are preserved.
- Current navigation and handoff are regenerated for the destination shadow context.
- The later Mnemosyne initial-memory-system candidate and migration-preparation branch artifacts are not adopted or imported.

## Remaining migration work

1. Review the destination shadow pull request.
2. Mechanically compare the imported source paths and content identities against the frozen source snapshot.
3. Run destination-only fresh-session recovery with a next-tier model.
4. Resolve any actual missing or incorrect file; do not add a memory foundation during this migration.
5. Ask the Owner for an explicit target-truth repository/path cutover decision.
6. After cutover, freeze the old Mnemosyne target root as historical bootstrap evidence and an immutable pointer.

## Exactly one safe next action

```yaml
safe_next_action: human_and_mechanical_review_of_the_destination_shadow_pull_request
no_automatic_cutover: true
no_automatic_operational_activation: true
```
EOF

          cat > handoff/handoff-current.md <<'EOF'
---
target_project_id: meta-agent
artifact_id: META-AGENT-V0.1-HANDOFF-001
artifact_role: fresh_session_handoff
status: dedicated_repository_shadow_import_ready_for_review
authority_level: non_execution_navigation
target_runtime_truth_source: false
last_updated_by_task: META-AGENT-DEDICATED-REPOSITORY-SHADOW-MIGRATION-001
---

# Meta-Agent Handoff — Dedicated Repository Shadow Import

## Authority boundary

The sole active Meta-Agent target truth remains in Mnemosyne until a separate Owner cutover:

```text
08822407d/Mnemosyne@8ef1c43b18b8686a30ffef544ca8b32fce1ca6cb
target-projects/meta-agent/current/approved-spec.md
```

The candidate destination path is:

```text
08822407d/Meta-Agent
current/approved-spec.md
```

The destination copy is shadow-only, non-authoritative and operationally inactive.

## Required reading order in the destination shadow

1. `current/approved-spec.md` — preserved target truth candidate, still inactive;
2. `authority/source-and-owner-map.md`;
3. `current/active-context.md`;
4. `handoff/handoff-current.md`;
5. `history/decision-version-and-migration-log.md`;
6. `methodology/core-methodology.md`;
7. `cases/case-and-feedback-ledger.md`;
8. `migration/source-snapshot-pointer.yaml`;
9. relevant research manifests, formal reviews and candidates only as the current task requires.

The copied `current/meta-agent-mnemosyne-guidance-compatibility-guard.md` remains historical/temporary process-safety evidence. It must not import Mnemosyne maintenance state. A Meta-Agent-owned behavior-guidance design may be considered after migration; it is not adopted by this shadow import.

## Current state

```yaml
